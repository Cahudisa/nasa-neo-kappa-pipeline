name: Daily NEO Bronze Ingestion

on:
  schedule:
    - cron: "0 12 * * *"   # runs every day at 12:00 UTC
  workflow_dispatch:        # allows manual trigger from the Actions tab, for testing

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NEO data (Bronze layer)
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python scripts/fetch_neo_bronze.py

      - name: Commit and push new Bronze data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bronze/
          git diff --staged --quiet && echo "No new data to commit" || (git commit -m "chore: daily NEO bronze ingestion $(date -u +%Y-%m-%d)" && git push)
